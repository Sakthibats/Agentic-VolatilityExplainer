name: Deploy frontend

# Builds the Next.js static export and publishes `frontend/out` to Cloudflare
# Pages. Pull requests build and lint only; deploys happen from main.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking: two pre-existing react-hooks/set-state-in-effect errors
      # (price-chart.tsx, theme-toggle.tsx) would otherwise gate every deploy.
      # Flip to blocking once those are resolved.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # NEXT_PUBLIC_* is inlined at build time, so an unset value would silently
      # ship a bundle pointing at the lib/api.ts localhost default.
      - name: Verify API URL is configured
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::Repository variable NEXT_PUBLIC_API_URL is not set."
            exit 1
          fi

      - name: Build static export
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy out --project-name=market-explainer --branch=main
