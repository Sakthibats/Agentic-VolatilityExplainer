name: Tests

on:
  # main is covered by docker-publish.yml, which runs this same suite as the
  # gate before build-and-push. Excluding it here avoids installing the deps
  # and running the tests twice on the same commit.
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Lint
        run: ruff check backend tests
