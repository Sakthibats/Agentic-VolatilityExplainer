name: Live data contracts

# Verifies that our upstream data sources (yfinance/Yahoo, Finnhub) still return the SHAPES
# our parsers assume. Every other test mocks its data source, so none of them can catch an
# upstream contract change — which is exactly how Ticker.calendar going DataFrame -> dict
# left fetch_events returning nothing but a hardcoded FOMC date, with a green suite.
#
# Deliberately NOT run on push: these hit real APIs, so they are rate-limited, occasionally
# flaky, and would block unrelated PRs. A failure here means an upstream contract moved —
# fix the parser, then update the mocked tests to the new shape.

on:
  schedule:
    # Mondays 06:00 UTC — early enough in the week to act on a break before it ships.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  # Also run when a data source or its parser changes, so a bad assumption is caught in
  # the PR that introduced it rather than up to a week later.
  pull_request:
    paths:
      - "backend/volatility_explainer/tools/**"
      - "backend/volatility_explainer/clients/**"
      - "tests/tools/test_live_contracts.py"
      - "pyproject.toml"
      - ".github/workflows/live-contracts.yml"

jobs:
  live-contracts:
    runs-on: ubuntu-latest
    # Only what the failure path needs: filing/commenting on the tracking issue.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run live contract tests
        # Finnhub-backed tests skip themselves when the key is absent, so a fork PR
        # without access to secrets still exercises the yfinance half.
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        # The tests themselves now skip on 5xx/429 rather than failing, so reaching this
        # far means a response arrived and its SHAPE was wrong. The retries below cover the
        # narrower case of a blip that outlasts the client's own backoff — spaced by a real
        # sleep, because the previous back-to-back `|| pytest` landed inside the same
        # outage every time and never once salvaged a run.
        run: |
          for attempt in 1 2 3; do
            if pytest -m live -q --maxfail=0; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::notice::live contracts attempt $attempt failed — retrying in ${attempt}m"
              sleep $((attempt * 60))
            fi
          done
          exit 1

      # A red check on a cron job is easy to scroll past for weeks; an issue is not.
      # Scheduled runs only — a PR already surfaces its own failure inline.
      - name: Open an issue on contract breakage
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Live data contracts failing";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const body = [
              `The weekly live-contract run failed after 3 attempts: ${url}`,
              "",
              "The tests skip transport failures (5xx/429), so this means an upstream",
              "response arrived and its shape no longer matches what our parsers assume.",
              "",
              "Fix the parser first, then update the mocked tests to the new shape.",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "live-contracts",
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${new Date().toISOString().slice(0, 10)}: ${url}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["live-contracts"],
              });
            }
