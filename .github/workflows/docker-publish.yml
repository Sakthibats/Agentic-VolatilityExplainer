name: Build and push Docker image

on:
  push:
    branches: [main]
    # Frontend-only commits ship via frontend-deploy.yml; no need to rebuild
    # and redeploy the backend image for them.
    paths:
      - "backend/**"
      - "tests/**"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  IMAGE_NAME: sakthibas98/agentic-market-explainer
  GCP_PROJECT_ID: agenticmarketexplainer-501814
  GCP_REGION: asia-southeast1
  CLOUD_RUN_SERVICE: agentic-market-explainer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Lint
        run: ruff check backend tests

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # Cloud Run pulls Docker Hub images through Google's mirror (mirror.gcr.io),
      # which can lag a fresh push by a few minutes. Deploying straight after the
      # push then fails with "Image ... not found", so wait for the mirror first.
      - name: Wait for the image on mirror.gcr.io
        run: |
          url="https://mirror.gcr.io/v2/${{ env.IMAGE_NAME }}/manifests/${{ github.run_number }}"
          accept="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: $accept" "$url")
            if [ "$code" = "200" ]; then echo "Mirror has the image (attempt $i)"; exit 0; fi
            echo "Attempt $i: mirror returned $code, retrying in 20s"
            sleep 20
          done
          echo "::error::Image not on mirror.gcr.io after 10 minutes"
          exit 1

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ env.CLOUD_RUN_SERVICE }}" \
            --image="${{ env.IMAGE_NAME }}:${{ github.run_number }}" \
            --region="${{ env.GCP_REGION }}" \
            --project="${{ env.GCP_PROJECT_ID }}" \
            --quiet
