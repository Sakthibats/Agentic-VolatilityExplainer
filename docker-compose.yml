services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - FRED_API_KEY=${FRED_API_KEY:-}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      - ./data:/app/data
