[project]
name = "volatility-explainer"
version = "0.1.0"
description = "Agentic market explainer: investigates why a stock or ETF moved, with deterministic vol math and a Claude tool-use loop"
readme = "README.md"
requires-python = ">=3.11"
# Every dependency is capped below its next major version (the next 1.0 for 0.x packages), so a
# fresh install or Docker build can't pull an untested breaking release. Raise a cap alongside a
# green test run (and `pytest -m live` for data sources and LLM SDKs).
dependencies = [
    "pydantic-settings>=2.0,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sse-starlette>=2.1,<4",
    "pandas>=2.0,<4",
    "anthropic>=0.40,<1",
    # The OpenAI adapter (llm/openai_provider.py) uses the Responses API's streaming events
    # and usage fields as of 3.46; widen alongside a green `pytest -m live tests/llm` run.
    "openai~=3.46",
    # Pinned to a minor range on purpose: yfinance reshapes its return types in minor
    # releases (Ticker.calendar went DataFrame -> dict in 0.2 and silently broke
    # fetch_events). Widen only alongside a green `pytest -m live` contract run.
    "yfinance>=1.4,<1.5",
    # Required by yfinance to parse Ticker.earnings_dates, the only remaining source of a
    # reported quarter's actual EPS. yfinance declares it optional and raises
    # "Import lxml failed" at call time without it, so pin it explicitly rather than
    # letting the beat/miss verdict vanish on a fresh install.
    "lxml>=5.0,<7",
    "supabase>=2.0,<3",
    "redis>=5.0,<9",
]

[project.optional-dependencies]
dev = [
    "ruff~=0.16.0",
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/volatility_explainer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately adopted in the Phase 2 cleanup: imports (I), modernization (UP),
# bugbear (B), comprehensions (C4), simplification (SIM), Ruff-native (RUF).
# Still excluded on purpose: DTZ (naive datetimes are fine for market-date math),
# S/BLE (bandit/blind-except — the remaining broad excepts are deliberate
# degrade-gracefully boundaries, each with a fallback).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
# `live` tests hit real upstream APIs to verify their response SHAPE still matches what
# our parsers assume — the failure mode mocked tests structurally cannot catch. Excluded
# from the default run (and from CI on every push); run them on a schedule and before
# widening any data-source pin:  pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: hits real upstream APIs (network required); excluded from the default run",
]
