[project]
name = "volatility-explainer"
version = "0.1.0"
description = "Agentic tool that explains stock implied volatility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "streamlit>=1.28",
    "pandas>=2.0",
    "numpy>=1.26",
    "anthropic>=0.40",
    "yfinance>=0.2",
    "plotly>=5.0",
    "supabase>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff~=0.16.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/volatility_explainer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit selection = the pre-0.16 ruff defaults. Ruff 0.16 broadened its default
# rule set; we adopt the stricter rules deliberately in the Phase 2 cleanup, not as
# a side effect of a linter upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
