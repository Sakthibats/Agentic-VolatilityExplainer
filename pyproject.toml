[project]
name = "volatility-explainer"
version = "0.1.0"
description = "Agentic tool that explains stock implied volatility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "anthropic>=0.40",
    "yfinance>=0.2",
    "supabase>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff~=0.16.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/volatility_explainer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately adopted in the Phase 2 cleanup: imports (I), modernization (UP),
# bugbear (B), comprehensions (C4), simplification (SIM), Ruff-native (RUF).
# Still excluded on purpose: DTZ (naive datetimes are fine for market-date math),
# S/BLE (bandit/blind-except — the remaining broad excepts are deliberate
# degrade-gracefully boundaries, each with a fallback).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
