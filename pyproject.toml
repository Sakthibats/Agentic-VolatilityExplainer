[project]
name = "volatility-explainer"
version = "0.1.0"
description = "Agentic tool that explains stock implied volatility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "anthropic>=0.40",
    # Pinned to a minor range on purpose: yfinance reshapes its return types in minor
    # releases (Ticker.calendar went DataFrame -> dict in 0.2 and silently broke
    # fetch_events). Widen only alongside a green `pytest -m live` contract run.
    "yfinance>=1.4,<1.5",
    "supabase>=2.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff~=0.16.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/volatility_explainer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately adopted in the Phase 2 cleanup: imports (I), modernization (UP),
# bugbear (B), comprehensions (C4), simplification (SIM), Ruff-native (RUF).
# Still excluded on purpose: DTZ (naive datetimes are fine for market-date math),
# S/BLE (bandit/blind-except — the remaining broad excepts are deliberate
# degrade-gracefully boundaries, each with a fallback).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
# `live` tests hit real upstream APIs to verify their response SHAPE still matches what
# our parsers assume — the failure mode mocked tests structurally cannot catch. Excluded
# from the default run (and from CI on every push); run them on a schedule and before
# widening any data-source pin:  pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: hits real upstream APIs (network required); excluded from the default run",
]
